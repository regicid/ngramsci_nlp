# Extra portrayal pass over shards 0-304 of politique (scored 2026-11-22 before family names): only the chains named by
# their family name, into portrayal_surnames/. n_shards stays 305: later shards get family names in their first run.
# Political articles of the French online press, 2008 -> June 2026 (rubrique `politique` of n-gramsci/rubriques-presse,
# Le Monde excluded: done in the Le Monde corpus), 1,450,278 articles in 305 shards of 5,000.
name: politique                                    # same corpus: same private text, same board
n_shards: 305
hub_repo: regicid/qcoref-politique-work          # private board
source: {host: saclay, dir: /data/qcoref_pol/shards, pattern: "shard_{k:05d}.jsonl.gz"}
ttl_hours: {parse_ner: 3, qwen: 6}
params:
  parse_ner: {k: 10}
  qwen: {single_process: true}
  quotes: {compute_type: float16, split: chunks}
  # v2 with family names (data/surnames.json). Shards 0-304 were scored before family names existed: their extra chains
  # are scored by corpora/politique_surnames.yaml into portrayal_surnames/; portrayal/ + portrayal_surnames/ = every person.
  portrayal: {seeds: [0], exclude_possessive: true, revision: 678e23cc21ff9026f5a183ef7905ee5a0ac119d3,
              surnames_file: data/surnames.json, only_surname: true}
layout:
  portrayal: portrayal_surnames/shard_{k:05d}.parquet
